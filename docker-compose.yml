# Spatial Map — the whole self-hosted stack in one command:
#
#   cp .env.example .env        # set VITE_MAPBOX_ACCESS_TOKEN
#   docker compose up -d        # → http://localhost:3000
#
# Only the web container is published; it serves the app and proxies /api
# and /files to the API. Postgres, MinIO and Redis stay on the internal
# network. Images are built locally on first run; to use the published
# ones instead: `docker compose pull` first (tags: SPATIAL_MAP_VERSION).
#
# Optional AI floor-plan tool (~1.7 GB image): docker compose --profile ai up -d
#
# Backend development (API on :8080, Postgres on :5432, SPA via `npm run dev`)
# uses backend/docker-compose.yml instead — see docs/workflow.md.

name: spatial-map

x-storage-env: &storage-env
  SGV_STORAGE.MINIO_ENDPOINT: minio:9000
  SGV_STORAGE.MINIO_ACCESS_KEY: ${SPATIAL_MAP_MINIO_USER:-minioadmin}
  SGV_STORAGE.MINIO_SECRET_KEY: ${SPATIAL_MAP_MINIO_PASSWORD:-minioadmin}
  SGV_STORAGE.MINIO_BUCKET: spatial-map-uploads
  SGV_STORAGE.MINIO_USE_SSL: "false"

services:
  web:
    image: ghcr.io/siraj-zaki/spatial-map-web:${SPATIAL_MAP_VERSION:-latest}
    build:
      context: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      SPATIAL_MAP_MAPBOX_TOKEN: ${SPATIAL_MAP_MAPBOX_TOKEN:-${VITE_MAPBOX_ACCESS_TOKEN:-}}
      SPATIAL_MAP_TERMS_URL: ${SPATIAL_MAP_TERMS_URL:-}
      SPATIAL_MAP_PRIVACY_URL: ${SPATIAL_MAP_PRIVACY_URL:-}
    ports:
      - "${SPATIAL_MAP_PORT:-3000}:80"
    restart: unless-stopped

  api:
    image: ghcr.io/siraj-zaki/spatial-map-api:${SPATIAL_MAP_VERSION:-latest}
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-worker:
        condition: service_healthy
        required: false
    environment:
      <<: *storage-env
      SGV_MODE: ${SPATIAL_MAP_MODE:-development}
      SGV_DATABASE.URL: postgres://spatial:${SPATIAL_MAP_DB_PASSWORD:-spatial}@postgres:5432/spatial?sslmode=disable
      # Set a long random value (openssl rand -hex 32) for anything beyond a
      # local trial; SPATIAL_MAP_MODE=production refuses the placeholder.
      SGV_AUTH.JWT_SECRET: ${SPATIAL_MAP_JWT_SECRET:-dev-jwt-secret-change-in-production}
      # Key for machine access to /api/v1 (scripts, integrations); signed-in
      # users don't need it. Required in production mode.
      SGV_AUTH.API_KEY: ${SPATIAL_MAP_API_KEY:-}
      SGV_AUTH.BOOTSTRAP_EMAIL: ${SPATIAL_MAP_ADMIN_EMAIL:-}
      SGV_AUTH.BOOTSTRAP_PASSWORD: ${SPATIAL_MAP_ADMIN_PASSWORD:-}
      # Used for links in auth emails.
      SGV_APP.PUBLIC_URL: ${SPATIAL_MAP_PUBLIC_URL:-http://localhost:3000}
      SGV_MIGRATION.ON_START: "true"
      SGV_MIGRATION.PATH: /app/migrations
      SGV_DEMO.ENABLED: ${SPATIAL_MAP_DEMO:-true}
      SGV_STORAGE.TYPE: minio-fallback
      SGV_STORAGE.BASE_PATH: /app/uploads
      SGV_STORAGE.BASE_URL: /files
      SGV_SERVER.PORT: "8080"
      # The API is only reachable through the web container, so the
      # forwarded client IP it sends can be trusted (rate limits per user).
      SGV_SERVER.TRUSTED_PROXIES: ${SPATIAL_MAP_TRUSTED_PROXIES:-172.16.0.0/12}
      SGV_AI_WORKER.URL: http://ai-worker:8100
      # SMTP for signup / password-reset codes. Unset = codes are printed to
      # the API log: docker compose logs api | grep -i code
      SGV_MAIL.HOST: ${SPATIAL_MAP_SMTP_HOST:-}
      SGV_MAIL.PORT: ${SPATIAL_MAP_SMTP_PORT:-587}
      SGV_MAIL.USERNAME: ${SPATIAL_MAP_SMTP_USER:-}
      SGV_MAIL.PASSWORD: ${SPATIAL_MAP_SMTP_PASSWORD:-}
      SGV_MAIL.FROM: ${SPATIAL_MAP_MAIL_FROM:-no-reply@spatialmap.local}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: spatial
      POSTGRES_PASSWORD: ${SPATIAL_MAP_DB_PASSWORD:-spatial}
      POSTGRES_DB: spatial
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-run init the image runs a
      # temporary socket-only server that would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spatial -d spatial"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SPATIAL_MAP_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SPATIAL_MAP_MINIO_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${SPATIAL_MAP_MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${SPATIAL_MAP_MINIO_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD &&
      mc mb --ignore-existing local/spatial-map-uploads"
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ai-worker:
    profiles: [ai]
    build:
      context: ./backend/ai-worker
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *storage-env
      SGV_REDIS.URL: redis://redis:6379/0
      SGV_AI_WORKER.HOST: "0.0.0.0"
      SGV_AI_WORKER.PORT: "8100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  miniodata:
  redisdata:
