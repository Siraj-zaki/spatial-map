name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a facility in the editor
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: env
    attributes:
      label: Browser & OS
      placeholder: Chrome 140 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console errors, API logs (remove any secrets or personal data).
